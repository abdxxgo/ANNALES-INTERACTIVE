<script type="application/json" id="soschimie-annale-data">{"title":"Cardiologie 03 23 24","questions":[{"id":"q-1","type":"qcm","choices":["A. Est ce que votre patient a des antécédents familiaux de mort subite?","B. Est ce que la perte de connaissance a été précédée de prodrome ?","C. Est ce que le patient a eu des vertiges","D. La dure de la perte de connaissance","E. Est ce qu’il a eu une perte de selles","F. Est ce que la syncope et survenue à l ‘effort","G. La profession de votre patient","H. Recherche d’un déficit neurologique","I. Interrogatoire sur la prise de anticoagulants ou anticoagulants plaquettaire (pour les conséquences d'un TC-PC)","J. Recherche d’une hypotension orthostatique","K. Interrogatoire sur la consommation d’alcool","L. Massage sino carotidien"],"figures":[],"choiceFigures":[],"correctionFigures":[],"context":"Un homme de 58 ans est amené aux urgences par le SAMU au décours d’une perte de connaissance survenue au\nsupermarché. Il présente comme antécédents une HTA traite par Ramipril et un tabagisme actif à 35PA.ll vous raconte\nles circonstances de sa chute. Il était dans supermarché, il ne se souvient pas exactement de ce qui est arrivé, et s’est\nretrouvé à terre avec des passants autour de lui qui lui demandaient comment il allait. Il a une plaie au scalp et au\ncoude, ne décrit pas de palpitations, dyspnée ou de douleur thoracique.A l’arrivée du SAMU : Fc =65 BPM, la\nTA=150/80mmHg, la saturation est à 96% en ventilation spontanée. L’auscultation cardiaque et pulmonaire semble sans\nanomalie.","prompt":"Quels sont les éléments essentiels à rechercher lors de votre interrogatoire et à l’examen objectif? (6 réponses attendues)","section":"KFP1","qNumber":"1","sourceSegmentTitle":"KFP1","localization":false,"needsImage":false,"correctAnswers":[0,1,3,5,7,8],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. vrai car les antécédents familiaux de mort subite orientent vers une cause rythmique. B. vrai car les prodromes distinguent une syncope réflexe d'une cause cardiaque. C. faux car les vertiges sont peu discriminants. D. vrai car la durée de la perte de connaissance caractérise la syncope. E. faux car la perte de selles n'est pas un élément essentiel. F. vrai car une syncope à l'effort évoque une cause cardiaque grave. G. faux car la profession n'est pas essentielle. H. vrai car un déficit neurologique oriente vers une cause neurologique. I. vrai car les anticoagulants ou antiagrégants aggravent les conséquences d'un traumatisme crânien. J. faux selon le corrigé. K. faux car l'alcool n'est pas un élément essentiel. L. faux car le massage sino-carotidien n'est pas un élément à rechercher à l'interrogatoire.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-2","type":"qcm","choices":["A. ECG","B. Radiographie du thorax","C. EEG","D. Ionogramme sanguin","E. Dosage de la troponine","F. Mesure de la CRP","G. Dosage des DDimeres plasmatiques","H. CT cranio -encéphalique","I. Echocardiographie","J. Alcoolémie","K. Aucun, le diagnostic est évident"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"Votre interrogatoire et les informations donné par les pompiers vous orientent vers une syncope vraie. Quels examens\nsont nécessaires pour l’enquête étiologique lors de sa prise en charge au SAU? Sélectionnez 4 items ou sélectionnez # K\nsi aucun item n’est valide","section":"KFP1","qNumber":"2","sourceSegmentTitle":"KFP1","localization":false,"needsImage":false,"correctAnswers":[0,3,4,6],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. vrai car l'ECG est systématique devant une syncope. B. faux car non contributive. C. faux car l'EEG n'est pas indiqué pour une syncope vraie. D. vrai car l'ionogramme recherche un trouble métabolique. E. vrai car la troponine recherche une cause cardiaque ischémique. F. faux car la CRP n'oriente pas l'étiologie. G. vrai selon le corrigé. H. faux car le scanner cérébral n'est pas systématique sans déficit. I. faux selon le corrigé. J. faux car non nécessaire. K. faux car le diagnostic n'est pas évident.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-3","type":"qcm","choices":["A. Faire sortir le patient avec un bilan à faire en ambulatoire","B. Faire un cycle de troponine","C. Hospitalisation du patient en cardiologie pour surveillance « scopée »","D. Hospitalisation du patient en neurologie pour surveillance","E. Angio-TDM des artères pulmonaires devant les d-dimères positifs","F. La troponine positive et la présence d’un BBG permet d’affirmer le diagnostic de SCA","G. Echographie cardiaque transthoracique","H. Adresser le patient vers un centre d’angiographie pour une coronarographie en urgence","I. Adresser le patient dans un service de rythmologie, pour pose de pace-maker","J. Aucun item n’est valide"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"Le bilan biologique montre une Troponine T hs à 54 ng/l (normale \u003c14ng/L), D-Dimeres 520ng/L. L’ECG est en\nrythme sinusal 65pm avec aspect de BBG complet (largeur des QRS a 122ms)Quelle conduite à tenir proposez-vous?\nSélectionnez 3 items ou sélectionnez # J si aucun item n’est valide","section":"KFP1","qNumber":"3","sourceSegmentTitle":"KFP1","localization":false,"needsImage":false,"correctAnswers":[1,2,6],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. faux car le patient doit être surveillé. B. vrai car la cinétique de troponine est nécessaire. C. vrai car une surveillance scopée est indiquée. D. faux car l'origine est probablement cardiaque. E. faux car les D-dimères sont peu élevés pour l'âge. F. faux car cela ne suffit pas à affirmer un SCA. G. vrai car l'échographie recherche une cardiopathie. H. faux car pas d'urgence coronarographique démontrée. I. faux car le rythme est sinusal à 65/min. J. faux car des items sont valides.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-4","type":"qcm","choices":["A. improbable","B. peu probable","C. ni plus ou moins probable","D. probable","E. certain"],"figures":[],"choiceFigures":[],"correctionFigures":[],"context":"Un homme de 75 ans se présente aux urgences dyspnée rapidement croissante évoluant depuis 48h.","prompt":"Vous suspectez une insuffisance cardiaque aiguë et vous apprenez que :\nLa concentration de NTproBNP est de 170ng/L (normale \u003c300ng/L)\nQuelle est la probabilité quelle diagnostic soit de l'insuffisance cardiaque aiguë","section":"TCS1","qNumber":"1","sourceSegmentTitle":"TCS1","localization":false,"needsImage":false,"correctAnswers":[0],"singleAnswer":true,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. vrai : un NTproBNP à 170 ng/L, inférieur au seuil de 300 ng/L, a une forte valeur prédictive négative et rend l'insuffisance cardiaque aiguë improbable. B. faux : l'écart avec le seuil et la valeur prédictive négative justifient « improbable » plutôt que « peu probable ». C. faux : l'information fait baisser la probabilité, elle n'est pas neutre. D. faux : un NTproBNP normal ne va pas dans le sens de la probabilité du diagnostic. E. faux : une certitude est exclue, d'autant que le marqueur est normal.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-5","type":"qcm","choices":["A. improbable","B. peu probable","C. ni plus ou moins probable","D. probable","E. certain"],"figures":[],"choiceFigures":[],"correctionFigures":[],"context":"Un homme de 75 ans se présente aux urgences dyspnée rapidement croissante évoluant depuis 48h.","prompt":"Vous suspectez une insuffisance cardiaque aiguë et vous apprenez que :\nL’examen retrouve des œdèmes volumineux\nQuelle est la probabilité qu'il s'agisse d'insuffisance cardiaque","section":"TCS2","qNumber":"1","sourceSegmentTitle":"TCS2","localization":false,"needsImage":false,"correctAnswers":[3,4],"singleAnswer":true,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. faux : des œdèmes volumineux vont dans le sens de l'insuffisance cardiaque, elle n'est donc pas improbable. B. faux : même raison, elle n'est pas peu probable. C. faux : l'élément rend le diagnostic plus probable, pas neutre. D. vrai : œdèmes volumineux associés à une dyspnée aiguë chez un homme de 75 ans rendent le diagnostic probable. E. vrai : accepté par le corrigé officiel comme alternative.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-6","type":"qcm","choices":["A. Il s’agit d’une tachycardie ventriculaire","B. Il s’agit d’une fibrillation auriculaire","C. Le patient est porteur d’un pace-maker","D. Il présente un syndrome coronarien aigu avec sus-décalage du ST (SCA ST+) en plus de l’anomalie du rythme","E. Il présente un syndrome coronarien aigu sans sus-décalage du ST (SCA ST-) en plus de l’anomalie du rythme"],"figures":[{"figureId":"q-6-sujet-0","nodeId":"","inlineUrl":"data:image/webp;base64,UklGRmRQAwBXRUJQVlA4WAoAAAAgAAAAvAMA1gIASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggdk4DALARBp0BKr0D1wI+GQqDQaEF7hQEAGEtLd6UT+o1QNUcBR/TWmz/TM5Bp  irrégulier sans onde P, tachycardie à QRS fins. C. faux : pas de spicule de stimulation. D. faux : pas de sus-décalage du ST. E. faux : pas de signe de SCA ST- sur le tracé.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-7","type":"qcm","choices":["A. Consommation excessive d’alcool les heures précédentes","B. Sepsis","C. Deshydratation","D. Hypothyroïdie","E. Hypoxie transitoire"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"Vous avez retenu le diagnostic de fibrillation auriculaire (FA). Parmi les causes suivantes, quelle(s) est(sont) une(des)\ncause(s) de FA réversible ?","section":"mDP1","qNumber":"2","sourceSegmentTitle":"mDP1","localization":false,"needsImage":false,"correctAnswers":[0,1,2],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. vrai : l'alcool aigu déclenche une FA, régressive à l'arrêt. B. vrai : le sepsis est un facteur déclenchant transitoire. C. vrai : la déshydratation est un facteur déclenchant corrigeable. D. faux selon le corrigé : c'est l'hyperthyroïdie qui favorise la FA. E. faux selon le corrigé officiel.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-8","type":"qcm","choices":["A. 1","B. 2","C. 3","D. 4","E. 0"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"QRU: Quel est le score CHADSvasc du patient en vous basant seulement sur l’énoncé?","section":"mDP1","qNumber":"3","sourceSegmentTitle":"mDP1","localization":false,"needsImage":false,"correctAnswers":[1],"singleAnswer":true,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. faux : le score est supérieur. B. vrai : HTA 1 point, diabète 1 point, âge 55 ans 0 point, soit 2. C. faux : rien d'autre n'est mentionné. D. faux : trop élevé. E. faux : HTA et diabète comptent.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-9","type":"qcm","choices":["A. Amiodarone","B. B-Bloquant","C. Isoprénaline","D. Inhibiteur de l’enzyme de conversion (IEC)","E. Inhibiteur calcique non dihydropyridine (exemple verapamil)"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"Quelle(s) classe(s) thérapeutique(s) est(sont) indiquée(s) pour ralentir la fréquence cardiaque","section":"mDP1","qNumber":"4","sourceSegmentTitle":"mDP1","localization":false,"needsImage":false,"correctAnswers":[1,4],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. faux selon le corrigé : l'amiodarone est un antiarythmique de réduction, non retenu ici. B. vrai : freine la conduction nodale. C. faux : l'isoprénaline accélère le cœur. D. faux : pas d'effet chronotrope. E. vrai : le vérapamil ralentit la conduction nodale.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-10","type":"qcm","choices":["A. Héparine de bas poids moléculaire (HBPM)","B. AVK d’emblée","C. AVK après relai Héparine de bas poids moléculaire (HBPM)","D. Anticoagulant oral direct (AOD)","E. Héparine non fractionnée (HNF)"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"QRU: Le bilan biologique est normal. Quel anticoagulant recommandez-vous en première intention ?","section":"mDP1","qNumber":"5","sourceSegmentTitle":"mDP1","localization":false,"needsImage":false,"correctAnswers":[3],"singleAnswer":true,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. faux : l'HBPM n'est pas le traitement de fond. B. faux : les AVK ne sont pas de première intention. C. faux : même raison, avec relais inutile. D. vrai : les AOD sont recommandés en première intention dans la FA non valvulaire. E. faux : l'HNF est réservée à des situations particulières.","correctionSource":"officielle","fullyNormalized":false, ngleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. faux : LDL 0,9 g/L au-dessus de la cible. B. vrai : intensifier l'hypolipidémiant. C. faux : pas de bradycardie symptomatique ni indication de stimulation. D. vrai : FEVG ≤30 % persistante à plus de 40 jours post-infarctus. E. faux : pas d'indication de transplantation.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-18","type":"qcm","choices":["A. Elle est indiquée quelle que soit la valeur du CHADSVASc dans le rétrécissement mitral serré","B. L’aspirine est indiquée en cas de CHADSVASc égal à 0","C. Les nouveaux anticoagulants oraux sont indiqués dans la FA quelle que soit la cardiopathie sous-jacente à condition que le score CHADSVASc soit supérieur ou égal à 2","D. Un ATCD d’AVC ischémique est une indication d’anticoagulation s’il est secondaire à de la FA","E. Un score HAS BLED supérieur à 3 est une contre-indication formelle à la poursuite d’une anticoagulation"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"Concernant l’anticoagulation dans la fibrillation atriale, citer les réponses vraies","section":"SQI1","qNumber":"1","sourceSegmentTitle":"SQI1","localization":false,"needsImage":false,"correctAnswers":[0,3],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. vrai : dans le RM serré, anticoagulation par AVK d'emblée. B. faux : pas d'aspirine, aucun traitement si CHADSVASc 0. C. faux : les AOD sont contre-indiqués en cas de RM serré ou de prothèse mécanique. D. vrai : l'AVC ischémique lié à la FA impose l'anticoagulation. E. faux : un HAS-BLED élevé impose de corriger les facteurs de risque, pas d'arrêter.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-19","type":"qcm","choices":["A. Statines pour tous les patients dès la prise en charge avec un objectif de LDL \u003c 0.55g/L","B. les Bêta-bloquants sont indiqués uniquement si la FEVG \u003c 40%.","C. Les inhibiteurs de l’enzyme de conversion (IEC) sont indiqués en cas de FEVG \u003c40%","D. les antagonistes des récepteurs de l’angiotensine II (ARA II) sont préférés aux inhibiteurs de l’enzyme de conversion (IEC) chez les patients âgés","E. le régime peu salé est indispensable"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"la prévention secondaire au décours d'un syndrome coronarien aigu sans sus-décalage du segment ST comprend :\n(Quelles sont les propositions vraies ?)","section":"SQI1","qNumber":"2","sourceSegmentTitle":"SQI1","localization":false,"needsImage":false,"correctAnswers":[0,2],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. vrai : statine forte, LDL cible \u003c 0,55 g/L. B. faux : les bêta-bloquants sont indiqués aussi hors dysfonction VG selon le contexte. C. vrai : IEC si FEVG \u003c 40 %. D. faux : les IEC restent de première intention, les ARA II en cas d'intolérance. E. faux : un régime peu salé n'est pas indispensable.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-20","type":"qcm","choices":["A. elle peut compliquer une phlébite surale","B. le seul examen à réaliser est le dosage des D-dimères plasmatiques","C. elle s’accompagne habituellement d’un effet shunt gazométrique","D. l’électrocardiogramme peut être normal","E. A l’auscultation pulmonaire, on note habituellement des râles crépitants"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"Parmi les propositions suivantes concernant l’embolie pulmonaire, quelles sont vraies ?","section":"SQI1","qNumber":"3","sourceSegmentTitle":"SQI1","localization":false,"needsImage":false,"correctAnswers":[0,2,3],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. vrai : une thrombose veineuse distale, même surale, peut emboliser. B. faux : il faut une probabilité clinique puis un angioscanner. C. vrai : l'effet shunt entraîne une hypoxémie avec hypocapnie. D. vrai : l'ECG est souvent normal ou montre une tachycardie sinusale. E. faux : l'auscultation est habituellement normale.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-21","type":"qcm","choices":["A. L’épanchement péricardique est le plus souvent de faible abondance","B. L’origine est le plus souvent bactérienne","C. Elle est souvent précédée d’une infection ORL ou respiratoire","D. Les récidives sont exceptionnelles","E. La vitesse de sédimentation est souvent élevée"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"La péricardite aiguë bénigne. Citer la(es) affirmation(s) vraie(s)","section":"SQI1","qNumber":"4","sourceSegmentTitle":"SQI1","localization":false,"needsImage":false,"correctAnswers":[0,2,4],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. vrai : l'épanchement est minime. B. faux : l'origine est le plus souvent virale ou idiopathique. C. vrai : prodrome viral fréquent. D. faux : les récidives sont fréquentes. E. vrai : syndrome inflammatoire biologique.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-22","type":"qcm","choices":["A. Endocardite infectieuse","B. Hémolyse","C. Dégénérescence","D. Accidents thrombo-emboliques","E. Bloc auriculo-ventriculaire"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"Chez un patient porteur d’une prothèse valvulaire mécanique en position mitrale, quelles sont les complications\npossibles (en lien avec la prothèse)?","section":"SQI1","qNumber":"5","sourceSegmentTitle":"SQI1","localization":false,"needsImage":false,"correctAnswers":[0,1,3],"singleAnswer":false,"explicitNone":false,"indispensables one":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. faux : le RAA donne une atteinte valvulaire chronique. B. vrai : rupture ou dysfonction de pilier. C. vrai : perforation ou destruction valvulaire. D. faux : pas de cause directe. E. vrai : prolapsus brutal du feuillet.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-25","type":"qcm","choices":["A. Embolie pulmonaire","B. Pleurésie aiguë","C. Tamponnade","D. Pneumopathie aigue communautaire hypoxémiante","E. Angioedème secondaire aux IEC (inhibiteur de l’enzyme de conversion)"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"Monsieur F, un homme âgé de 78 ans est amené par les pompiers aux urgences pour dyspnée.Il s’agit d’un patient suivi\nen oncologie pour un adénocarcinome pulmonaire lobaire inférieure droit métastatique sous chimiothérapie.Il a comme\nautres antécédents : Insuffisance rénale modérée avec DFG à 47 ml/min, Tabagisme sevré depuis 3 ans à 60 PA, HTA\ntraitée par inhibiteurs de l’enzyme de conversion (IEC).Depuis quelques semaines il se plaint d’un essoufflement\ninvalidant, qui s’est cependant brutalement aggravé ce matin ; il se plaint également d’une toux sèche et d’une douleur\ndans la poitrine qui est présente surtout lors des efforts de toux ou s’il inspire profondément.Il devait consulter auprès de\nson oncologue dans la semaine avec un scanner thoracique de contrôle mais devant la dyspnée invalidante a appelé les\npompiers.A l’examen physique on retrouve : Température 37.1°C, pouls 101/min, pression artérielle 100/68 mm Hg,\nfréquence respiratoire 37/minutes, saturation en ventilation spontanée 90% ; l’auscultation cardiaque retrouve un rythme\nrégulier sans souffle, une diminution du murmure vésiculaire de la base droite.Le bilan biologique met en évidence :\ncréatinine 178 μmol/L- DFG 35ml/min, D dimères 10 500 ng/L, CRP 58 mg/L, NT-proBNP 1050 ng/L (normale\ninférieure à 300ng/L), Troponine T (Hs) 72 ng/L (normale inférieure à 14ng/L).Il bénéficie de la réalisation d’une\néchocardiographie transthoracique aux urgences qui retrouve : FEVG conservée, pas de valvulopathie gauche, pas de\ntrouble de cinétique, ventricule droit modérément dilaté, septum paradoxal ; fonction ventriculaire droite conservée,\nhypertension pulmonaire, épanchement péricardique de 8 mm non compressif.Quel est le diagnostic le plus probable\n(QRU)?","section":"SQI1","qNumber":"8","sourceSegmentTitle":"SQI1","localization":false,"needsImage":false,"correctAnswers":[0],"singleAnswer":true,"explicitNone":false,"indispensables":[],"inacceptables":[],"normalises":[],"correctAnswerText":"","explanation":"A. vrai : cancer, dyspnée brutale, D-dimères élevés, cœur droit dilaté avec HTP. B. faux : pas de syndrome pleural net, la douleur est expliquée par l'EP. C. faux : épanchement de 8 mm non compressif. D. faux : apyrexie, CRP modérée, tableau cardiaque droit. E. faux : aucun signe d'œdème des voies aériennes.","correctionSource":"officielle","fullyNormalized":false,"countsForScore":true},{"id":"q-26","type":"qcm","choices":["A. La cardiopathie ischémique représente la première cause d'insuffisance cardiaque","B. Les anthracyclines peuvent être responsable de cardiomyopathie hypertrophique","C. L’hypertension artérielle provoque en premier lieu une altération de la fonction diastolique.","D. L'amylose cardiaque est une cause d’insuffisance cardiaque qui est plus fréquente chez le patient âgé","E. Une fibrillation atriale rapide prolongée peut entraîner une cardiomyopathie"],"figures":[],"choiceFigures":[],"correctionFigures":[],"prompt":"Concernant le diagnostic étiologique de l’insuffisance cardiaque, laquelle(lesquelles) de ces propositions est/sont\nexacte(s) :","section":"SQI1","qNumber":"9","sourceSegmentTitle":"SQI1","localization":false,"needsImage":false,"correctAnswers":[0,2,3,4],"singleAnswer":false,"explicitNone":false,"indispensables":[],"inacceptables":[],"norma <script type="module">/**
 * @param {readonly {section?: string, sourceSegmentTitle?: string, sourceTitle?: string, qNumber?: string}[]} questions
 * @param {number} index
 * @param {Record<number, number>} attempts
 * @param {number|null} [justAnswered]
 * @returns {number|undefined}
 */
export function unansweredDPPrerequisite(questions, index, attempts, justAnswered = null) {
  const dossier = (question) => (question.section?.trim() ||
    question.sourceSegmentTitle?.trim().replace(/\s+\(\d+\/\d+\)$/, "") || "")
    .replace(/^[eé]l[eé]ment\s+d['’][eé]preuve\s*:\s*/i, "").toLowerCase().replace(/\s+/g, " ");
  const current = questions[index];
  if (!current) return undefined;
  const group = dossier(current);
  if (!/^(?:m?dp(?=\s*\d|\b)|dossier\s+(?:progressif|patient)\b)/i.test(group)) return undefined;
  let prerequisite;
  for (let previous = index - 1; previous >= 0; previous--) {
    const question = questions[previous];
    if (question.sourceTitle !== current.sourceTitle || dossier(question) !== group ||
      /^(?:q\.?\s*)?1$/i.test(String(questions[previous + 1].qNumber ?? "").trim())) break;
    if (previous !== justAnswered && !(attempts[previous] > 0)) prerequisite = previous;
  }
  return prerequisite;
}

/**
 * Note d'une QROC. La réponse attendue liste les réponses valides du corrigé
 * séparées par « / » ; celles qui ne valent qu'une partie des points suivent
 * entre parenthèses : « a / b (accepté pour une partie des points : c / d) ».
 * Une réponse vaut 1 si elle est l'une des réponses valides, 0,5 si elle est
 * l'une des réponses partielles, 0 sinon — sans tenir compte des majuscules,
 * des accents, des espaces ni de la ponctuation finale.
 * @param {string | undefined} expectedText
 * @param {string} actualText
 * @returns {number}
 */
export function scoreQroc(expectedText, actualText) {
  const normalize = (text) => String(text ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, " ").trim().replace(/[\s.;:,!?]+$/, "");
  const actual = normalize(actualText);
  const expected = String(expectedText ?? "").trim();
  if (!actual || !expected) return 0;
  const split = (text) => text.split(" / ").map(normalize).filter(Boolean);
  const partial = expected.match(/\s*\(accepté pour une partie des points\s*:\s*(.*)\)\s*$/i);
  const main = partial ? expected.slice(0, partial.index) : expected;
  const full = split(main);
  // Ancien format en un bloc : « Réponse (précision) » accepte aussi « Réponse ».
  for (const answer of [...full]) {
    const sansPrecision = answer.replace(/\s*\([^)]*\)\s*$/, "");
    if (sansPrecision && sansPrecision !== answer) full.push(sansPrecision);
  }
  if (full.includes(actual) || normalize(expected) === actual) return 1;
  if (partial && split(partial[1]).includes(actual)) return 0.5;
  // Petites fautes de frappe ou d'orthographe tolérées (voir `presqueEgal`).
  if (full.some((answer) => presqueEgal(answer, actual))) return 1;
  if (partial && split(partial[1]).some((answer) => presqueEgal(answer, actual))) return 0.5;
  return 0;
}

/**
 * Une réponse « presque » égale : même texte au pluriel près (« vaccinations »
 * pour « vaccination ») et à UNE faute près — deux à partir de 14 lettres. Les
 * réponses courtes (moins de 5 lettres) et celles qui contiennent un nombre
 * restent exigées à l'identique : « 33 » n'est pas « 3 », « VHB » n'est pas
 * « VIH ». Volontairement serré : « hyperkaliémie » ne passe pas pour
 * « hypokaliémie » (deux fautes sur douze lettres).
 * @param {string} expected déjà normalisé
 * @param {string} actual déjà normalisé
 */
function presqueEgal(expected, actual) {
  if (expected.length < 5 || /\d/.test(expected) || /\d/.test(actual)) return false;
  const singulier = (text) => text.split(" ").map((word) => word.length > 3 ? word.replace(/[sx]$/, "") : word).join(" ");
  const a = singulier(expected);
  const b = singulier(actual);
  if (a === b) return true;
  const tolerance = a.length >= 14 ? 2 : 1;
  if (Math.abs(a.length - b.length) > tolerance) return false;
  // Distance d'édition (Levenshtein), arrêtée dès qu'elle dépasse la tolérance.
  let previous = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i += 1) {
    const row = [i];
    let best = i;
    for (let j = 1; j <= b.length; j += 1) {
      row[j] = Math.min(previous[j] + 1, row[j - 1] + 1, previous[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      best = Math.min(best, row[j]);
    }
    if (best > tolerance) return false;
    previous = row;
  }
  return previous[b.length] <= tolerance;
}

/**
 * @param {{choices: readonly string[], singleAnswer?: boolean, indispensables?: number[], inacceptables?: number[]}} q
 * @param {number[]} expected
 * @param {number[]} actual
 */
export function scoreQcm(q, expected, actual) {
  if (q.singleAnswer) {
    if (expected.length === 0) return Number(actual.length === 0);
    return Number(actual.length === 1 && expected.includes(actual[0]));
  }
  const indispensables = q.indispensables || [];
  const inacceptables = q.inacceptables || [];
  const hasMissedIndispensable = indispensables.some((req) => !actual.includes(req));
  const hasSelectedInacceptable = inacceptables.some((inacc) => actual.includes(inacc));
  if (hasMissedIndispensable || hasSelectedInacceptable) return 0;
  const isKFP = q.choices.length > 5;
  if (isKFP) {
    // Règle KFP : proportionnel x/n
    const n = expected.length;
    if (n === 0) return actual.length === 0 ? 1 : 0;
    const correctChecked = actual.filter((a) => expected.includes(a)).length;
    const incorrectChecked = actual.filter((a) => !expected.includes(a)).length;
    // On calcule (bonnes - mauvaises) / attendues pour éviter qu'un étudiant coche toutes les cases
    const s = (correctChecked - incorrectChecked) / n;
    return Math.max(0, Number(s.toFixed(2)));
  }
  // Règle DP classique (QRM à 5 choix max)
  let incoherences = 0;
  for (const ans of actual) if (!expected.includes(ans)) incoherences++;
  for (const ans of expected) if (!actual.includes(ans)) incoherences++;
  if (incoherences === 0) return 1;
  if (incoherences === 1) return 0.5;
  if (incoherences === 2) return 0.2;
  return 0;
}

  all: "M4 5h16v6H4zM4 13h16v6H4z",
};
function icon(name, className) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("class", "icon" + (className ? " " + className : ""));
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", ICONS[name]);
  svg.append(path);
  return svg;
}

function appendImage(container, src, alt) {
  if (!src) return;
  const image = element("img");
  image.src = src;
  image.alt = alt;
  container.append(image);
  return image;
}

function formatStopwatch(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const mmss = String(Math.floor((total % 3600) / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
  return h > 0 ? h + ":" + mmss : mmss;
}

const numero = (index) => questions[index].qNumber || index + 1;
const answeredCount = () => Object.keys(attempts).length;
const pointsTotal = () => scores.filter((score) => typeof score === "number").reduce((total, score) => total + score, 0);
const pendingOthers = () => questions.filter((_, i) => i !== current && !attempts[i] && !fermee(i)).length;

// ---------------------------------------------------------------------------
// Barre du haut
// ---------------------------------------------------------------------------

const clock = button("", () => {
  if (stopwatch.since === null) stopwatch.since = Date.now();
  else { stopwatch.accumMs = stopwatchMs(); stopwatch.since = null; }
  renderClock();
}, "chip clock");
const navToggle = button("", () => { panelOpen = !panelOpen; renderPanelVisibility(); }, "chip nav-toggle");
navToggle.setAttribute("aria-controls", "panel");

// Mode clair / sombre : le réglage de l'appareil la première fois, puis le
// choix de l'élève, mémorisé dans ce navigateur (sans jamais bloquer si le
// stockage est indisponible, par exemple un fichier ouvert en navigation privée).
const THEME_KEY = "soschimie-annale-theme";
let theme = (() => {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === "dark" || saved === "light") return saved;
  } catch { /* stockage indisponible */ }
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
})();
const themeToggle = button("", () => {
  theme = theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, theme); } catch { /* stockage indisponible */ }
  renderTheme();
}, "chip theme-toggle");
function renderTheme() {
  document.documentElement.dataset.theme = theme;
  themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
  themeToggle.title = theme === "dark" ? "Passer en mode clair" : "Passer en mode sombre";
  themeToggle.setAttribute("aria-label", themeToggle.title);
}
renderTheme();
tools.append(themeToggle, clock, navToggle);

function renderClock() {
  const paused = stopwatch.since === null;
  clock.replaceChildren(icon(paused ? "play" : "pause"), element("span", formatStopwatch(stopwatchMs())));
  clock.setAttribute("aria-pressed", String(paused));
  clock.title = paused ? "Reprendre le chronomètre" : "Mettre le chronomètre en pause";
  clock.setAttribute("aria-label", "Chronomètre " + formatStopwatch(stopwatchMs()) + (paused ? " en pause — reprendre" : " — mettre en pause"));
}

function renderTopbar() {
  position.textContent = finished ? "Annale terminée" : "Question " + (current + 1) + " / " + questions.length;
  scoreBadge.textContent = pointsTotal().toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " / " + gradedTotal + " pt";
  navToggle.replaceChildren(icon("grid"), element("span", "Navigation", "label"),
    element("span", answeredCount() + "/" + questions.length, "count"));
  navToggle.setAttribute("aria-expanded", String(panelOpen));
  navToggle.setAttribute("aria-label", "Navigation");
}

function renderPanelVisibility() {
  document.body.classList.toggle("panel-open", panelOpen);
  navToggle.setAttribute("aria-expanded", String(panelOpen));
}
wide.addEventListener("change", () => { panelOpen = wide.matches; renderPanelVisibility(); });
document.querySelector(".scrim")?.addEventListener("click", () => { panelOpen = false; renderPanelVisibility(); });

// ---------------------------------------------------------------------------
// Panneau de navigation
// ---------------------------------------------------------------------------

function tone(index) {
  if (!attempts[index]) return (drafts[index]?.selected?.length || drafts[index]?.text?.trim()) ? "draft" : "unseen";
  const score = scores[index];
  if (score === null || score === undefined) return "recorded";
  return score >= 1 ? "correct" : score > 0 ? "partial" : "wrong";
}

function renderPanel() {
  panel.replaceChildren();
  const head = element("div", "", "panel-head");
  const titles = element("div");
  const flaggedCount = Object.values(flagged).filter(Boolean).length;
  titles.append(element("h2", "Navigation"), element("p",
    answeredCount() + " validée" + (answeredCount() >= 2 ? "s" : "") + " · " + flaggedCount + " marquée" + (flaggedCount >= 2 ? "s" : ""), "muted small"));
  const close = button("", () => { panelOpen = false; renderPanelVisibility(); }, "icon-button");
  close.append(icon("close"));
  close.setAttribute("aria-label", "Masquer la navigation");
  head.append(titles, close);
  panel.append(head);

  const bar = element("div", "", "progress");
  const fill = element("div");
  fill.style.width = Math.round((answeredCount() / Math.max(questions.length, 1)) * 100) + "%";
  bar.append(fill);
  panel.append(bar);

  const scroller = element("div", "", "tiles-scroll");
  let group = null;
  let groupLabel;
  questions.forEach((question, index) => {
    const label = question.section || "";
    if (!group || label !== groupLabel) {
      groupLabel = label;
      const block = element("div", "", "group");
      if (label) block.append(element("div", label, "group-label"));
      group = element("div", "", "tiles");
      block.append(group);
      scroller.append(block);
    }
    const locked = fermee(index);
    const tile = button(String(numero(index)), () => { showQuestion(index); if (!wide.matches) { panelOpen = false; renderPanelVisibility(); } }, "tile " + tone(index));
    tile.disabled = locked;
    if (index === current && !finished) tile.setAttribute("aria-current", "true");
    if (locked) tile.append(icon("lock", "tile-lock"));
    if (flagged[index]) tile.append(element("span", "", "tile-flag"));
    tile.title = locked ? "Valide les questions précédentes de ce dossier" : "Question " + numero(index);
    tile.setAttribute("aria-label", [question.section, "Question " + numero(index)].filter(Boolean).join(" · ")
      + (locked ? " — verrouillée" : attempts[index] ? " — validée" : " — sans réponse") + (flagged[index] ? ", marquée" : ""));
    group.append(tile);
  });
  panel.append(scroller);

  const legend = element("div", "", "legend");
  [["correct", "juste"], ["partial", "partielle"], ["wrong", "à revoir"], ["recorded", "enregistrée"], ["flagged", "marquée"]]
    .forEach(([kind, text]) => {
      const item = element("span");
      item.append(element("i", "", "dot " + kind), document.createTextNode(text));
      legend.append(item);
    });
  panel.append(legend);

  const segment = element("div", "", "segment");
  segment.setAttribute("role", "group");
  segment.setAttribute("aria-label", "Affichage des questions");
  [["one", "Une à la fois"], ["all", "Toutes"]].forEach(([mode, text]) => {
    const control = button("", () => { viewMode = mode; showQuestion(current); }, viewMode === mode ? "active" : "");
    control.append(icon(mode), element("span", text));
    control.setAttribute("aria-pressed", String(viewMode === mode));
    segment.append(control);
  });
  panel.append(segment);

  if (hasDossier) {
    const sw = button("", () => {
      overview = !overview;
      if (!fermee(current)) showQuestion(current);
      else showQuestion(questions.findLastIndex((_, i) => i <= current && !fermee(i)));
    }, "row switch-row");
    sw.setAttribute("role", "switch");
    sw.setAttribute("aria-checked", String(overview));
    sw.title = "Voir toutes les questions des dossiers, même celles qui ne sont pas encore débloquées";
    const text = element("span", "", "row-text");
    text.append(icon(overview ? "unlock" : "lock"), element("span", "Vue d'ensemble des dossiers"));
    sw.append(text, element("span", "", "switch" + (overview ? " on" : "")));
    panel.append(sw);
  }

  const others = pendingOthers();
  if (others > 0) {
    const pending = button("", () => {
      const next = questions.findIndex((_, i) => i > current && !attempts[i] && !fermee(i));
      showQuestion(next !== -1 ? next : questions.findIndex((_, i) => !attempts[i] && !fermee(i)));
    }, "row");
    pending.append(element("span", others + " question" + (others >= 2 ? "s" : "") + " laissée" + (others >= 2 ? "s" : "") + " de côté", "row-text"), icon("chevron"));
    panel.append(pending);
  }

  const done = answeredCount() === questions.length;
  const finish = button("Terminer", showResult, "finish" + (done ? " ready" : ""));
  finish.disabled = !done;
  finish.title = done ? "Voir mon score" : "Réponds à toutes les questions pour terminer";
  panel.append(finish);
}

// ---------------------------------------------------------------------------
// Question
// ---------------------------------------------------------------------------

function renderLocalization(question, draft, form, locked, update) {
  const src = question.figures.find((figure) => !figure.placement)?.inlineUrl || question.imageUrl;
  if (!src) {
    form.append(element("p", question.correctionFigures.length
      ? "Le visuel annoté est disponible dans le corrigé."
      : "Le visuel de localisation est indisponible.", "muted"));
    return false;
  }
  const frame = element("div", "", "localisation");
  const target = element(locked ? "div" : "button", "", "zone");
  if (!locked) {
    target.type = "button";
    target.setAttribute("aria-label", "Placer un point sur l’image");
    form.append(element("p", "Clique sur l’image pour placer un point. Au clavier, utilise les flèches puis Entrée.", "muted small"));
  }
  appendImage(target, src, "Image de localisation");
  frame.append(target);
  form.append(frame);
  const cursor = { x: 0.5, y: 0.5 };
  const draw = () => {
    target.querySelectorAll(".point").forEach((point) => point.remove());
    const add = ({x, y}, label, extra) => {
      const point = element("span", label, "point" + (extra ? " cursor" : ""));
      point.style.left = x * 100 + "%";
      point.style.top = y * 100 + "%";
      point.setAttribute("aria-hidden", "true");
      target.append(point);
    };
    draft.points.forEach((point, index) => add(point, String(index + 1), false));
    if (!locked) add(cursor, "+", true);
  };
  if (!locked) {
    target.addEventListener("keydown", (event) => {
      const movement = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[event.key];
      if (!movement) return;
      event.preventDefault();
      cursor.x = Math.max(0, Math.min(1, cursor.x + movement[0] * 0.04));
      cursor.y = Math.max(0, Math.min(1, cursor.y + movement[1] * 0.04));
      draw();
    });
    target.addEventListener("click", (event) => {
      const bounds = target.getBoundingClientRect();
      const point = event.detail === 0 ? { ...cursor }
        : { x: (event.clientX - bounds.left) / bounds.width, y: (event.clientY - bounds.top) / bounds.height };
      draft.points.push(point);
      draw();
      update();
    });
    form.append(button("Retirer le dernier point", () => { draft.points.pop(); draw(); update(); }, "link"));
  }
  draw();
  return true;
}

function lockedCard(index) {
  const question = questions[index];
  const card = element("article", "", "card locked");
  card.id = "question-" + index;
  const badge = element("span", "", "lock-badge");
  badge.append(icon("lock"));
  const text = element("div");
  text.append(element("strong", "Question " + numero(index) + (question.section ? " · " + question.section : "")),
    element("p", "Se débloque quand tu auras validé la question précédente du dossier.", "muted small"));
  card.append(badge, text);
  return card;
}

function buildCard(index, solo) {
  const question = questions[index];
  const draft = drafts[index] ??= { selected: [], text: "", points: [] };
  const locked = Boolean(attempts[index]);
  const normalized = question.normalises ?? [];
  const graded = (indices = []) => indices.filter((value) => !normalized.includes(value));
  const expected = graded(question.correctAnswers);
  const isQroc = question.type === "qroc" && !question.localization;
  const fullyNormalized = question.fullyNormalized;
  const card = element("article", "", "card");
  card.id = "question-" + index;
  if (!solo && index === current) card.classList.add("current");

  const top = element("div", "", "card-top");
  const pill = element("span", "", "section-pill");
  pill.append(icon("pin"), element("span", question.section || question.sourceTitle || "Question"));
  const flag = button("", () => { flagged[index] = !flagged[index]; flag.classList.toggle("on", flagged[index]); flag.setAttribute("aria-pressed", String(flagged[index])); renderPanel(); }, "icon-button flag" + (flagged[index] ? " on" : ""));
  flag.append(icon("flag"));
  flag.setAttribute("aria-pressed", String(Boolean(flagged[index])));
  flag.setAttribute("aria-label", "Marquer la question " + numero(index));
  flag.title = "Marquer pour y revenir";
  top.append(pill, flag);
  card.append(top);

  if (question.context) card.append(element("p", question.context, "context"));
  question.figures.filter((figure) => figure.placement === "context")
    .forEach((figure) => appendImage(card, figure.inlineUrl, "Image du dossier"));
  const heading = element("h2", "", "prompt");
  heading.tabIndex = -1;
  heading.append(element("span", "Q." + numero(index), "qnum"), document.createTextNode(" " + question.prompt));
  card.append(heading);
  const state = element("p", "", "state " + (locked ? "done" : "todo"));
  state.append(element("i"), document.createTextNode(locked ? "Validée" : "Sans réponse"));
  card.append(state);
  if (!question.localization) {
    const figures = question.figures.filter((figure) => !figure.placement);
    const holder = element("div", "", "figures");
    figures.forEach((figure, i) => appendImage(holder, figure.inlineUrl, "Schéma " + (i + 1)));
    if (!figures.length) appendImage(holder, question.imageUrl, "Schéma de la question");
    if (holder.childElementCount) card.append(holder);
  }

  const form = element("form");
  const submit = element("button", question.localization ? "Voir le corrigé" : "Valider", "submit");
  submit.type = "submit";
  let hasLocalizationImage = false;
  const update = () => {
    submit.disabled = question.localization ? hasLocalizationImage && draft.points.length === 0
      : isQroc ? !draft.text.trim() : !fullyNormalized && draft.selected.length === 0;
  };
  if (question.localization) {
    hasLocalizationImage = renderLocalization(question, draft, form, locked, update);
  } else if (isQroc) {
    const label = element("label", "", "free-answer");
    label.append(element("span", "Ta réponse", "muted small"));
    const input = element("input");
    input.type = "text";
    input.value = draft.text;
    input.readOnly = locked;
    if (locked) input.classList.add(tone(index));
    input.placeholder = "Écris ta réponse";
    input.addEventListener("input", () => { draft.text = input.value; update(); });
    label.append(input);
    form.append(label);
  } else {
    const choices = element("fieldset", "", "options");
    choices.append(element("legend", question.singleAnswer ? "Une seule réponse" : "Une ou plusieurs réponses", "sr-only"));
    const addChoice = (text, value, figure) => {
      const status = locked && (normalized.includes(value) ? "neutralisée"
        : (value === -1 ? expected.length === 0 : expected.includes(value)) ? "attendue"
        : draft.selected.includes(value) ? "non attendue" : "");
      const option = element("label", "", "option");
      if (status) option.dataset.status = status;
      const match = /^\s*([A-Z])[.)]\s+/.exec(text);
      option.append(element("span", value === -1 ? "∅" : match ? match[1] : String.fromCharCode(65 + value), "letter"));
      const input = element("input");
      input.type = question.singleAnswer ? "radio" : "checkbox";
      input.name = "response-" + index;
      input.checked = draft.selected.includes(value);
      input.disabled = locked;
      input.value = String(value);
      const box = element("span", "", "box" + (question.singleAnswer ? " round" : ""));
      const labelText = element("span", match ? text.slice(match[0].length) : text, "option-text");
      if (figure) appendImage(labelText, figure.inlineUrl, "Schéma de la proposition " + (value + 1));
      if (status) labelText.append(element("small", status === "attendue" ? "✓ attendue" : status === "non attendue" ? "✗ non attendue" : status, "verdict"));
      option.append(input, box, labelText);
      input.addEventListener("change", () => {
        if (question.singleAnswer || value === -1) {
          draft.selected = input.checked ? [value] : [];
        } else {
          draft.selected = draft.selected.filter((choice) => choice !== -1 && choice !== value);
          if (input.checked) draft.selected.push(value);
        }
        choices.querySelectorAll("input").forEach((control) => {
          control.checked = draft.selected.includes(Number(control.value));
        });
        update();
      });
      choices.append(option);
    };
    question.choices.forEach((text, value) => addChoice(text, value, question.choiceFigures[value]));
    if (!question.explicitNone && !fullyNormalized) addChoice("Aucune de ces propositions n’est exacte", -1);
    form.append(choices);
  }
  if (!locked) {
    update();
    form.append(submit);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (submit.disabled || attempts[index]) return;
      const actual = graded(draft.selected.filter((choice) => choice >= 0));
      scores[index] = !question.countsForScore ? null
        : isQroc ? scoreQroc(question.correctAnswerText, draft.text)
        : scoreQcm({ ...question, indispensables: graded(question.indispensables), inacceptables: graded(question.inacceptables) }, expected, actual);
      attempts[index] = 1;
      showQuestion(index);
      document.querySelector("#question-" + index + " .correction")?.focus();
    });
  }
  card.append(form);
  if (locked) {
    const feedback = element("section", "", "correction");
    feedback.tabIndex = -1;
    feedback.append(element("h3", "Corrigé"));
    feedback.append(element("p", scores[index] === null ? (question.localization ? "Auto-évaluation" : "Hors barème")
      : "Points obtenus : " + String(scores[index]).replace(".", ",") + " / 1", "points " + tone(index)));
    if ((isQroc || question.localization) && question.correctAnswerText) {
      feedback.append(element("p", "Réponse attendue · " + question.correctAnswerText));
    }
    if (question.explanation) feedback.append(element("p", question.explanation));
    question.correctionFigures.forEach((figure, i) => appendImage(feedback, figure.inlineUrl, "Schéma du corrigé " + (i + 1)));
    card.append(feedback);
  }
  if (!solo) return { card, heading };

  const pager = element("div", "", "pager");
  const prev = questions.findLastIndex((_, i) => i < index && !fermee(i));
  const back = button("", () => showQuestion(prev), "ghost");
  back.append(icon("back"), element("span", "Précédent"));
  back.disabled = prev === -1;
  pager.append(back);
  const next = questions.findIndex((_, i) => i > index && !fermee(i));
  const right = element("div", "", "pager-right");
  if (questions[index + 1] && fermee(index + 1)) {
    const hint = element("span", "", "muted small lock-hint");
    hint.append(icon("lock"), document.createTextNode(" La question " + numero(index + 1) + " se débloque quand tu valides celle-ci."));
    right.append(hint);
    if (next !== -1) {
      const skip = button("", () => showQuestion(next), "ghost");
      skip.append(element("span", "Dossier suivant"), icon("chevron"));
      right.append(skip);
    }
  } else if (next !== -1) {
    const forward = button("", () => showQuestion(next), locked ? "primary" : "ghost");
    forward.append(element("span", locked ? "Question suivante" : "Passer"), icon("chevron"));
    right.append(forward);
  } else if (answeredCount() === questions.length) {
    right.append(button("Voir mon score", showResult, "primary"));
  }
  pager.append(right);
  card.append(pager);
  return { card, heading };
}

function showQuestion(index) {
  if (index < 0 || fermee(index)) return;
  finished = false;
  current = index;
  renderTopbar();
  renderPanel();
  if (viewMode === "one") {
    const { card, heading } = buildCard(index, true);
    main.replaceChildren(card);
    window.scrollTo({ top: 0 });
    heading.focus({ preventScroll: true });
    return;
  }
  const cards = questions.map((_, i) => (fermee(i) ? lockedCard(i) : buildCard(i, false).card));
  main.replaceChildren(...cards);
  const target = cards[index];
  const top = target.getBoundingClientRect().top + window.scrollY - (document.querySelector(".topbar")?.offsetHeight ?? 0) - 16;
  window.scrollTo({ top: Math.max(0, top) });
}

function showResult() {
  finished = true;
  if (stopwatch.since !== null) { stopwatch.accumMs = stopwatchMs(); stopwatch.since = null; }
  renderClock();
  renderTopbar();
  renderPanel();
  const card = element("article", "", "card result");
  const heading = element("h2", "Annale terminée");
  heading.tabIndex = -1;
  card.append(heading, element("p", gradedTotal
    ? pointsTotal().toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " / " + gradedTotal + " points"
    : "Annale hors barème", "big"));
  card.append(element("p", "Temps passé : " + formatStopwatch(stopwatchMs()), "muted"));
  card.append(button("Recommencer", () => {
    attempts = {};
    scores = [];
    drafts = [];
    flagged = {};
    stopwatch.accumMs = 0;
    stopwatch.since = Date.now();
    renderClock();
    showQuestion(0);
  }, "primary"));
  main.replaceChildren(card);
  window.scrollTo({ top: 0 });
  heading.focus({ preventScroll: true });
}

renderClock();
setInterval(renderClock, 1000);
renderPanelVisibility();
if (questions.length) showQuestion(0);
else main.append(element("p", "Cette annale ne contient aucune question."));
</script></body></html>
